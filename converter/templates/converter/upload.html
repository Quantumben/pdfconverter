<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to DOCX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4">Upload PDF to Convert</h1>
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded" type="submit">
                Convert to DOCX
            </button>
        </form>
        {% if docx_file %}
            <p class="mt-4 text-green-600 font-semibold">DOCX File Created:</p>
            <a class="text-blue-600 underline" href="{{ MEDIA_URL }}pdfs/{{ docx_file }}" download>Download DOCX</a>
        {% endif %}
    </div>
</body>
</html>
